# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/refs/heads/main/cspell.schema.json
useGitignore: true
version: "0.2"
language: en
ignorePaths:
  - flake.nix
ignoreWords:
  - haras
  - mcp-nix
  - nixpkgs
  - bwrap
  - bubblewrap
  - userns
  - MCP_NIX_SANDBOX
  - tmpfs
  - setuid
  - unsandboxed
  - sandboxed
  - sandboxing
  - TMPDIR
  - cwd
