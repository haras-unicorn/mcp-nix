[workspace]
resolver = "3"
members = ["src/crates/*"]

[workspace.package]
description = "MCP server that provides nix tooling."
repository = "https://github.com/haras-unicorn/mcp-nix"
authors = ["haras-unicorn <github@haras-unicorn.net>"]
license = "MIT"
readme = "README.md"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3
